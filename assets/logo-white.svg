  </defs>

  <!-- Circular Botanical Icon -->
  <g transform="translate(10, 10)">
    <circle cx="50" cy="50" r="46" fill="none" stroke="url(#goldGradWhite)" stroke-width="1.8" stroke-dasharray="3 2"/>
    <circle cx="50" cy="50" r="42" fill="#141E17" stroke="url(#goldGradWhite)" stroke-width="1.5"/>

    <path d="M35 62 L40 76 C42 81 58 81 60 76 L65 62 Z" fill="#996035" stroke="url(#goldGradWhite)" stroke-width="1.2"/>
    <rect x="36.5" y="65" width="27" height="3.5" rx="1" fill="url(#goldGradWhite)"/>

    <path d="M50 63 Q50 45 44 32" fill="none" stroke="url(#goldGradWhite)" stroke-width="2" stroke-linecap="round"/>
    
    <path d="M46 43 C36 41 33 28 47 33 C47 39 46 42 46 43 Z" fill="url(#leafGradWhite)" stroke="url(#goldGradWhite)" stroke-width="0.8"/>
    <path d="M47 36 C57 32 61 22 49 26 C47 31 47 34 47 36 Z" fill="#88C798" stroke="url(#goldGradWhite)" stroke-width="0.8"/>

    <circle cx="50" cy="22" r="2" fill="url(#goldGradWhite)"/>
    <line x1="50" y1="15" x2="50" y2="18" stroke="url(#goldGradWhite)" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="43" y1="18" x2="45" y2="20" stroke="url(#goldGradWhite)" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="57" y1="18" x2="55" y2="20" stroke="url(#goldGradWhite)" stroke-width="1.2" stroke-linecap="round"/>
  </g>

