<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C77C"/>
      <stop offset="50%" stop-color="#C59B4B"/>
      <stop offset="100%" stop-color="#9A7029"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2D5A43"/>
      <stop offset="100%" stop-color="#5B8E67"/>
    </linearGradient>
  </defs>

  <!-- Circular Botanical Icon -->
  <g transform="translate(10, 10)">
    <!-- Outer concentric ring -->
    <circle cx="50" cy="50" r="46" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" stroke-dasharray="3 2"/>
    <circle cx="50" cy="50" r="42" fill="#1E2B22" stroke="url(#goldGrad)" stroke-width="1.5"/>

    <!-- Wooden pot / shell base -->
    <path d="M35 62 L40 76 C42 81 58 81 60 76 L65 62 Z" fill="#8B5A2B" stroke="url(#goldGrad)" stroke-width="1.2"/>
    <!-- Brass band on pot -->
    <rect x="36.5" y="65" width="27" height="3.5" rx="1" fill="url(#goldGrad)"/>

    <!-- Sprouting seedling / stem -->
    <path d="M50 63 Q50 45 44 32" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Left Leaf -->
    <path d="M46 43 C36 41 33 28 47 33 C47 39 46 42 46 43 Z" fill="url(#leafGrad)" stroke="url(#goldGrad)" stroke-width="0.8"/>
    
    <!-- Right Leaf -->
    <path d="M47 36 C57 32 61 22 49 26 C47 31 47 34 47 36 Z" fill="#6EA579" stroke="url(#goldGrad)" stroke-width="0.8"/>

    <!-- Little sun / scent aura rays -->
    <circle cx="50" cy="22" r="2" fill="url(#goldGrad)"/>
    <line x1="50" y1="15" x2="50" y2="18" stroke="url(#goldGrad)" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="43" y1="18" x2="45" y2="20" stroke="url(#goldGrad)" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="57" y1="18" x2="55" y2="20" stroke="url(#goldGrad)" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <g transform="translate(125, 42)">
    <!-- Main Brand Name -->
    <text x="0" y="24" font-family="'Playfair Display', Georgia, serif" font-size="38" font-weight="700" letter-spacing="2.5" fill="#1C2D24">
      La Vida
    </text>
    
    <!-- Secondary Tagline -->
    <text x="2" y="47" font-family="'Inter', -apple-system, sans-serif" font-size="10.5" font-weight="600" letter-spacing="4.2" fill="#8C6D3B" text-transform="uppercase">
      Natural Deodorant · Zero Waste
    </text>

    <!-- Sub phrase -->
    <text x="2" y="63" font-family="'Playfair Display', Georgia, serif" font-size="11" font-style="italic" fill="#5F6D64" letter-spacing="0.5">
      Finish the scent. Plant the seed.
    </text>
  </g>
</svg>
